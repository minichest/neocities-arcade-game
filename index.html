<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Embedded Player</title>
    
    <!-- Load Ruffle from the stable unpkg CDN repository build -->
    <script src="https://unpkg.com/@ruffle-rs/ruffle/ruffle.js"></script>

    <style>
        /* Force the canvas container to fill 100% of the screen space natively */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            overflow: hidden; /* Drops browser scrollbars on the repository layout */
        }
        #ruffle-player {
            width: 100%;
            height: 100%;
            display: block;
        }
        #ruffle-player ruffle-player,
        #ruffle-player object,
        #ruffle-player embed {
            width: 100% !important;
            height: 100% !important;
            display: block !important;
            image-rendering: pixelated; /* Keeps your classic sprites looking razor sharp */
        }
    </style>
</head>
<body>

    <!-- Target mount container container -->
    <div id="ruffle-player"></div>

    
<script>
    // 2. Clear out any manual absolute URL declarations
    window.RufflePlayer = window.RufflePlayer || {};
    window.RufflePlayer.config = {
        /* FORCE RECENT ASSEMBLY ENGAGEMENT: Dropping the absolute path text string 
           lets Ruffle resolve file module requests directly using local environment variables */
        pageVisibility: false, /* Keeps audio loops spinning smoothly when tabs blur! */
        autoplay: "on",
        unmuteOverlay: "hidden"
    };

    // 3. Mount the functional framework instance into your display viewport
    window.addEventListener("DOMContentLoaded", () => {
        const ruffle = window.RufflePlayer.newest();
        const player = ruffle.createPlayer();
        const container = document.getElementById("ruffle-player");
        
        if (container) {
            container.appendChild(player);
            player.load({
                url: "res/games/sonic-scene-creator-v.2.swf"
            });
        }
    });
</script>

</body>
</html>
